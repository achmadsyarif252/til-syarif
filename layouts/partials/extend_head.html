<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" integrity="sha512-DNAIMQggD2DZbmmoxWl1CtNGYtXipXcQIkpn+HHrJgFyc1uQrp8Bxr3M8FZlpjOnrLXAFskDLE7dhAoT2i2Icg==" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" integrity="sha512-hyfIF6VLQivmvouhmXIvR9TZKUQKcbALZfw/vHFV1CXRWEUE7wDPRWkNCU5eKmYT/kUZWwlYAn3Q9GRqcyivDA==" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js" integrity="sha512-CROSA7Kk8CtE28pgXK4VpXFPKzt6cWjhi1J6EBLIRWTP2Fp+ArfN0nSVvUgvtHkkbnJseIVWyw9v0YvNJ38ARQ==" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\\\[', right: '\\\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\\\(', right: '\\\\)', display: false}
        ],
        throwOnError: false
    });"></script>
<style>
.streak-badge {
  position: absolute;
  right: 0;
  font-size: 2rem;
  font-weight: bold;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.streak-badge span.fire {
  display: inline-block;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const homeInfo = document.querySelector('.home-info');
  const title = document.querySelector('.home-info h1');
  if (homeInfo && title) {
    const badge = document.createElement('div');
    badge.className = 'streak-badge';
    badge.innerHTML = '<span class="fire">🔥</span> 123';
    badge.style.top = title.offsetTop + 'px'; 
    homeInfo.appendChild(badge);
  }
});
</script>
